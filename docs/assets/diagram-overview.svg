<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Skill 從自然語言到結果的工作方式</title><desc id="desc">以四個階段說明 Skill 如何協助建立工作台</desc>
  <style>.ink{fill:#171717;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}.t{font-size:30px;font-weight:800}.b{font-size:20px;font-weight:700}.s{font-size:16px;font-weight:600}.line{fill:none;stroke:#171717;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
  <rect width="1200" height="620" rx="24" fill="#f7edda"/><text x="48" y="64" class="ink t">從一句話走到可驗收結果</text><text x="48" y="98" class="ink b">Skill 不只生成畫面，而是協助你把工作說清楚</text>
  <g transform="translate(50 165)"><rect width="245" height="190" rx="16" fill="#fffdf7" stroke="#2563eb" stroke-width="5"/><circle cx="46" cy="48" r="27" fill="#2563eb"/><text x="37" y="58" fill="#fff" font-size="23" font-weight="800">1</text><text x="88" y="57" class="ink t">自然語言</text><path d="M34 100h174M34 126h122" class="line" stroke="#2563eb" opacity=".65"/><text x="34" y="164" class="ink s">這裡用起來不太順</text></g>
  <g transform="translate(325 165)"><rect width="245" height="190" rx="16" fill="#fffdf7" stroke="#dc2626" stroke-width="5"/><circle cx="46" cy="48" r="27" fill="#dc2626"/><text x="37" y="58" fill="#fff" font-size="23" font-weight="800">2</text><text x="88" y="57" class="ink t">痛點</text><path d="M34 103c35-38 68 38 103 0s68 38 103 0" class="line" stroke="#dc2626"/><text x="34" y="164" class="ink s">先確認想改善的結果</text></g>
  <g transform="translate(600 165)"><rect width="245" height="190" rx="16" fill="#fffdf7" stroke="#facc15" stroke-width="5"/><circle cx="46" cy="48" r="27" fill="#facc15"/><text x="37" y="58" fill="#171717" font-size="23" font-weight="800">3</text><text x="88" y="57" class="ink t">流程</text><path d="M34 111h46v-28h46v55h46v-37h39" class="line" stroke="#b66b00"/><text x="34" y="164" class="ink s">輸入 → 執行 → 結果</text></g>
  <g transform="translate(875 165)"><rect width="275" height="190" rx="16" fill="#fffdf7" stroke="#168449" stroke-width="5"/><circle cx="46" cy="48" r="27" fill="#168449"/><text x="37" y="58" fill="#fff" font-size="23" font-weight="800">4</text><text x="88" y="57" class="ink t">結果</text><path d="M36 137 91 106l52 22 73-71" class="line" stroke="#168449"/><path d="m202 58 16-2-3 17" class="line" stroke="#168449"/><text x="34" y="164" class="ink s">留下下一步與驗收證據</text></g>
  <path d="M296 260h26M571 260h26M846 260h26" class="line" stroke="#171717"/><path d="m312 248 18 12-18 12M587 248l18 12-18 12M862 248l18 12-18 12" class="line" stroke="#171717"/>
  <g transform="translate(190 445)"><text x="0" y="0" class="ink b">適用情境</text><rect x="0" y="25" width="122" height="48" rx="24" fill="#dbeafe"/><text x="31" y="57" class="ink s">學校</text><rect x="140" y="25" width="122" height="48" rx="24" fill="#fee2e2"/><text x="171" y="57" class="ink s">職場</text><rect x="280" y="25" width="122" height="48" rx="24" fill="#fef3c7"/><text x="311" y="57" class="ink s">創業</text><rect x="420" y="25" width="122" height="48" rx="24" fill="#dcfce7"/><text x="451" y="57" class="ink s">創作</text><rect x="560" y="25" width="122" height="48" rx="24" fill="#e5e7eb"/><text x="591" y="57" class="ink s">個人</text></g>
