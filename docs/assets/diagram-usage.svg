<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">自然語言持續修改流程</title><desc id="desc">從描述不順、確認痛點、比較方案到最小修改</desc>
  <style>.ink{fill:#171717;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}.t{font-size:29px;font-weight:800}.b{font-size:20px;font-weight:800}.s{font-size:16px;font-weight:600}.line{fill:none;stroke:#171717;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
  <rect width="1200" height="620" rx="24" fill="#f7edda"/><text x="48" y="64" class="ink t">不用背提示詞</text><text x="48" y="98" class="ink b">只要描述哪裡不順，Skill 會陪你往前確認</text>
  <g transform="translate(55 175)"><path d="M24 20h300v140H72l-48 42v-42H24Z" fill="#fffdf7" stroke="#2563eb" stroke-width="5"/><text x="55" y="76" class="ink b">這裡用起來不太順</text><text x="55" y="119" class="ink s">先說現象，不必先想方案</text></g>
  <g transform="translate(350 175)"><rect width="235" height="182" rx="16" fill="#fffdf7" stroke="#dc2626" stroke-width="5"/><circle cx="45" cy="48" r="26" fill="#dc2626"/><text x="36" y="57" fill="#fff" font-size="22" font-weight="800">1</text><text x="88" y="57" class="ink t">問痛點</text><text x="28" y="108" class="ink s">找不到資料</text><text x="28" y="138" class="ink s">看不到重點</text></g>
  <g transform="translate(620 175)"><rect width="235" height="182" rx="16" fill="#fffdf7" stroke="#facc15" stroke-width="5"/><circle cx="45" cy="48" r="26" fill="#facc15"/><text x="36" y="57" fill="#171717" font-size="22" font-weight="800">2</text><text x="88" y="57" class="ink t">問情境</text><text x="28" y="108" class="ink s">誰在什麼時候用</text><text x="28" y="138" class="ink s">完成後要留下什麼</text></g>
  <g transform="translate(890 175)"><rect width="255" height="182" rx="16" fill="#fffdf7" stroke="#168449" stroke-width="5"/><circle cx="45" cy="48" r="26" fill="#168449"/><text x="36" y="57" fill="#fff" font-size="22" font-weight="800">3</text><text x="88" y="57" class="ink t">選方案</text><text x="28" y="108" class="ink s">兩到三個最小方案</text><text x="28" y="138" class="ink s">選定後才修改</text></g>
  <path d="M326 265h18M585 265h18M855 265h18" class="line"/><path d="m334 253 18 12-18 12M593 253l18 12-18 12M863 253l18 12-18 12" class="line"/>
  <g transform="translate(260 465)"><rect width="680" height="76" rx="38" fill="#fffdf7" stroke="#171717" stroke-width="4"/><text x="70" y="48" class="ink b">最小修改</text><text x="248" y="48" class="ink b">→</text><text x="335" y="48" class="ink b">實際操作</text><text x="515" y="48" class="ink b">→</text><text x="600" y="48" class="ink b">留下差異</text></g>
</svg>
