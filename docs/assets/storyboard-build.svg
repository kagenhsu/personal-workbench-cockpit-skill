<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">從 PM 到開發落地的手繪說明</title><desc id="desc">以中央設計紙張和五個對話框說明 PM、設計、MCP、Agent 與開發落地</desc><style>.i{fill:#171717;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}.h{font-size:29px;font-weight:900}.b{font-size:19px;font-weight:800}.s{font-size:15px;font-weight:700}.l{fill:none;stroke:#171717;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="640" rx="28" fill="#fffdf7"/><text x="48" y="62" class="i h">把想法接到真的能開發</text><text x="48" y="96" class="i b">每一站都把下一站需要的資料交出去</text><g transform="translate(466 160)"><path d="M12 0h248l52 52v244H12Z" fill="#fff" stroke="#171717" stroke-width="7"/><path d="M260 0v57h52" fill="#2563eb" stroke="#171717" stroke-width="7"/><text x="58" y="119" class="i h">可編輯</text><text x="58" y="158" class="i b">設計源文件</text><rect x="58" y="190" width="176" height="35" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><rect x="58" y="240" width="125" height="35" rx="8" fill="#fef3c7" stroke="#facc15" stroke-width="4"/></g><g transform="translate(40 150)"><path d="M20 20h265v111H75l-55 38v-38H20Z" fill="#dbeafe" stroke="#171717" stroke-width="7"/><text x="48" y="70" class="i h">PM Skill</text><text x="48" y="105" class="i s">問題／場景／驗收</text></g><g transform="translate(895 150)"><path d="M20 20h265v111H75l-55 38v-38H20Z" fill="#fef3c7" stroke="#171717" stroke-width="7"/><text x="48" y="70" class="i h">設計稿</text><text x="48" y="105" class="i s">層級／狀態／變量</text></g><g transform="translate(40 410)"><path d="M20 20h265v111H75l-55 38v-38H20Z" fill="#fee2e2" stroke="#171717" stroke-width="7"/><text x="48" y="70" class="i h">MCP</text><text x="48" y="105" class="i s">資料／工具／權限</text></g><g transform="translate(895 410)"><path d="M20 20h265v111H75l-55 38v-38H20Z" fill="#dcfce7" stroke="#171717" stroke-width="7"/><text x="48" y="70" class="i h">Agent</text><text x="48" y="105" class="i s">角色／輸入／交接</text></g><g transform="translate(455 465)"><path d="M20 20h290v90H75l-55 35v-35H20Z" fill="#e5e7eb" stroke="#171717" stroke-width="7"/><text x="54" y="73" class="i h">開發落地</text><text x="192" y="73" class="i s">測試與驗收</text></g><path d="M305 235h138M895 235H757M305 495h138M895 495H757M600 460v-36" class="l" stroke="#dc2626" stroke-width="5"/><path d="m423 221 21 14-21 14M771 221l-21 14 21 14M423 481l21 14-21 14M771 481l-21 14 21 14M588 441l12-21 12 21" class="l" stroke="#dc2626" stroke-width="5"/></svg>
