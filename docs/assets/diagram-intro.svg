<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">個人工作台 Skill 新手與老手入口</title>
  <desc id="desc">從理解 Skill 到建立與持續修改的兩條使用路徑</desc>
  <style>.ink{fill:#171717;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}.t{font-size:30px;font-weight:800}.b{font-size:20px;font-weight:700}.s{font-size:16px;font-weight:600}.line{fill:none;stroke:#171717;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
  <rect width="1200" height="620" rx="24" fill="#f7edda"/><path d="M34 550c180-24 300 18 508-8 242-30 394 25 624-8" class="line" stroke="#b45309" stroke-width="3" opacity=".35"/>
  <text x="48" y="64" class="ink t">個人工作台 Skill</text><text x="48" y="98" class="ink b">先理解，再建立，最後持續修改</text>
  <g transform="translate(480 144)"><rect width="240" height="250" rx="16" fill="#fffdf7" stroke="#171717" stroke-width="4"/><circle cx="120" cy="85" r="48" fill="#2563eb"/><circle cx="102" cy="78" r="7" fill="#fff"/><circle cx="138" cy="78" r="7" fill="#fff"/><path d="M96 105q24 20 48 0" class="line" stroke="#fff" stroke-width="4"/><rect x="67" y="156" width="106" height="12" rx="6" fill="#facc15"/><rect x="67" y="181" width="76" height="12" rx="6" fill="#22c55e"/><text x="42" y="228" class="ink s">你的工作夥伴</text></g>
  <g transform="translate(52 150)"><rect width="330" height="210" rx="14" fill="#fffdf7" stroke="#2563eb" stroke-width="5"/><circle cx="46" cy="46" r="30" fill="#2563eb"/><text x="34" y="56" fill="#fff" font-size="26" font-weight="800">新</text><text x="91" y="52" class="ink t">新手路徑</text><text x="28" y="100" class="ink b">了解 Skill</text><path d="M42 120v46M42 166h230" class="line" stroke="#2563eb"/><circle cx="42" cy="120" r="8" fill="#facc15"/><circle cx="134" cy="166" r="8" fill="#dc2626"/><circle cx="230" cy="166" r="8" fill="#22c55e"/><text x="25" y="196" class="ink s">四項藍圖 → 第一個流程</text></g>
  <g transform="translate(818 150)"><rect width="330" height="210" rx="14" fill="#fffdf7" stroke="#dc2626" stroke-width="5"/><circle cx="46" cy="46" r="30" fill="#dc2626"/><text x="34" y="56" fill="#fff" font-size="26" font-weight="800">老</text><text x="91" y="52" class="ink t">老手路徑</text><text x="28" y="100" class="ink b">閱讀 Skill 結構</text><path d="M42 120v46M42 166h230" class="line" stroke="#dc2626"/><circle cx="42" cy="120" r="8" fill="#2563eb"/><circle cx="134" cy="166" r="8" fill="#facc15"/><circle cx="230" cy="166" r="8" fill="#22c55e"/><text x="25" y="196" class="ink s">設計稿 → MCP → Agent → 落地</text></g>
