<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Skill 安裝三步驟</title><desc id="desc">從下載 Skill、放入安裝目錄到重新啟動工具</desc>
  <style>.ink{fill:#171717;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}.t{font-size:30px;font-weight:800}.b{font-size:20px;font-weight:800}.s{font-size:16px;font-weight:600}.line{fill:none;stroke:#171717;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
  <rect width="1200" height="620" rx="24" fill="#f7edda"/><text x="48" y="64" class="ink t">安裝 Skill 的三個動作</text><text x="48" y="98" class="ink b">下載 → 放入 → 重新啟動，完成後用一句話驗收</text>
  <g transform="translate(70 170)"><rect width="300" height="190" rx="16" fill="#fffdf7" stroke="#2563eb" stroke-width="5"/><circle cx="54" cy="56" r="30" fill="#2563eb"/><text x="44" y="66" fill="#fff" font-size="25" font-weight="800">01</text><text x="105" y="64" class="ink t">下載</text><path d="M132 100v44M110 124l22 22 22-22" class="line" stroke="#2563eb"/><text x="38" y="173" class="ink s">GitHub 或既有來源</text></g>
  <g transform="translate(450 170)"><rect width="300" height="190" rx="16" fill="#fffdf7" stroke="#facc15" stroke-width="5"/><circle cx="54" cy="56" r="30" fill="#facc15"/><text x="44" y="66" fill="#171717" font-size="25" font-weight="800">02</text><text x="105" y="64" class="ink t">放入</text><path d="M92 112h116v48H92zM110 96h80" class="line" stroke="#b66b00"/><text x="38" y="178" class="ink s">放入 Skill 安裝目錄</text></g>
  <g transform="translate(830 170)"><rect width="300" height="190" rx="16" fill="#fffdf7" stroke="#168449" stroke-width="5"/><circle cx="54" cy="56" r="30" fill="#168449"/><text x="44" y="66" fill="#fff" font-size="25" font-weight="800">03</text><text x="105" y="64" class="ink t">重新啟動</text><path d="M130 104a38 38 0 1 0 22 65" class="line" stroke="#168449"/><path d="m153 163 2 23-21-11" class="line" stroke="#168449"/><text x="38" y="178" class="ink s">再說：這裡用起來不太順</text></g>
  <path d="M372 265h62M752 265h62" class="line"/><path d="m420 253 18 12-18 12M800 253l18 12-18 12" class="line"/>
  <g transform="translate(170 455)"><rect width="860" height="78" rx="14" fill="#fffdf7" stroke="#171717" stroke-width="4"/><text x="35" y="33" class="ink s">安裝位置</text><text x="35" y="60" class="ink b">C:\Users\User\.codex\skills\personal-workbench-cockpit</text></g>
</svg>
