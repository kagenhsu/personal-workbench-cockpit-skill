<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">工作台安全邊界手繪說明</title><desc id="desc">以中央守門角色和兩側對話框說明草稿可以先做，正式動作需要確認</desc><style>.i{fill:#171717;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}.h{font-size:29px;font-weight:900}.b{font-size:20px;font-weight:800}.s{font-size:16px;font-weight:700}.l{fill:none;stroke:#171717;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="620" rx="28" fill="#fffdf7"/><text x="48" y="62" class="i h">先看清楚，再確認，再執行</text><text x="48" y="96" class="i b">AI 可以陪你整理，但正式動作要由你決定</text><g transform="translate(455 174)"><path d="M145 0 275 47v112c0 93-60 149-130 179C75 308 15 252 15 159V47Z" fill="#2563eb" stroke="#171717" stroke-width="7"/><circle cx="112" cy="132" r="10" fill="#fff"/><circle cx="178" cy="132" r="10" fill="#fff"/><path d="M112 174q33 27 66 0" class="l" stroke="#fff" stroke-width="5"/><path d="m88 235 38 38 85-91" class="l" stroke="#facc15" stroke-width="12"/></g><g transform="translate(40 155)"><path d="M22 22h330v170H86l-64 44v-44H22Z" fill="#dcfce7" stroke="#171717" stroke-width="7"/><text x="52" y="77" class="i h">可以先做</text><text x="52" y="119" class="i s">AI 草稿／流程整理</text><text x="52" y="153" class="i s">任務方案／驗收清單</text></g><g transform="translate(828 155)"><path d="M22 22h330v170H86l-64 44v-44H22Z" fill="#fee2e2" stroke="#171717" stroke-width="7"/><text x="52" y="77" class="i h">需要確認</text><text x="52" y="119" class="i s">寫入／發布／通知</text><text x="52" y="153" class="i s">部署／刪除／付款</text></g><g transform="translate(245 485)"><rect width="710" height="68" rx="34" fill="#fef3c7" stroke="#171717" stroke-width="5"/><text x="104" y="45" class="i b">敏感資料不放入 Skill 或提示詞</text></g><path d="M390 270h56M810 270h-56" class="l" stroke="#171717" stroke-width="5"/><path d="m434 257 20 13-20 13M766 257l-20 13 20 13" class="l" stroke="#171717" stroke-width="5"/></svg>
