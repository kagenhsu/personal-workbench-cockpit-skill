<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">生成前四項藍圖</title><desc id="desc">誰在用、每天處理什麼、流程如何運作、最後看到什麼</desc>
  <style>.ink{fill:#171717;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}.t{font-size:29px;font-weight:800}.b{font-size:21px;font-weight:800}.s{font-size:16px;font-weight:600}.line{fill:none;stroke:#171717;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
  <rect width="1200" height="700" rx="24" fill="#f7edda"/><text x="50" y="62" class="ink t">開發前先問清楚</text><text x="50" y="96" class="ink b">四個答案會決定工作台要解決什麼</text>
  <g transform="translate(445 205)"><path d="M12 0h250l54 54v254H12Z" fill="#fffdf7" stroke="#171717" stroke-width="5"/><path d="M262 0v58h54" fill="#dbeafe" stroke="#171717" stroke-width="5"/><text x="47" y="130" class="ink t">工作台</text><text x="47" y="176" class="ink b">先問對問題</text><path d="M48 213h212M48 238h160" class="line" stroke="#2563eb" opacity=".55"/></g>
  <g transform="translate(55 155)"><rect width="325" height="190" rx="16" fill="#fffdf7" stroke="#2563eb" stroke-width="5"/><circle cx="46" cy="48" r="28" fill="#2563eb"/><text x="36" y="58" fill="#fff" font-size="23" font-weight="800">01</text><text x="92" y="57" class="ink t">誰在用</text><text x="30" y="112" class="ink b">目標用戶與情境</text><text x="30" y="150" class="ink s">學校／職場／創業／創作</text></g>
  <g transform="translate(820 155)"><rect width="325" height="190" rx="16" fill="#fffdf7" stroke="#facc15" stroke-width="5"/><circle cx="46" cy="48" r="28" fill="#facc15"/><text x="36" y="58" fill="#171717" font-size="23" font-weight="800">02</text><text x="92" y="57" class="ink t">每天處理什麼</text><text x="30" y="112" class="ink b">反覆處理的對象</text><text x="30" y="150" class="ink s">課程／工作／專案／選題</text></g>
  <g transform="translate(55 440)"><rect width="325" height="190" rx="16" fill="#fffdf7" stroke="#dc2626" stroke-width="5"/><circle cx="46" cy="48" r="28" fill="#dc2626"/><text x="36" y="58" fill="#fff" font-size="23" font-weight="800">03</text><text x="92" y="57" class="ink t">流程如何運作</text><text x="30" y="112" class="ink b">從紀錄到完成</text><text x="30" y="150" class="ink s">紀錄 → 安排 → 執行 → 完成</text></g>
  <g transform="translate(820 440)"><rect width="325" height="190" rx="16" fill="#fffdf7" stroke="#168449" stroke-width="5"/><circle cx="46" cy="48" r="28" fill="#168449"/><text x="36" y="58" fill="#fff" font-size="23" font-weight="800">04</text><text x="92" y="57" class="ink t">最後看到什麼</text><text x="30" y="112" class="ink b">結果與證據</text><text x="30" y="150" class="ink s">進度／風險／數據／復盤</text></g>
  <path d="M380 250h58M762 250h58M380 530h58M762 530h58" class="line" stroke="#171717"/><path d="m426 238 18 12-18 12M808 238l18 12-18 12M426 518l18 12-18 12M808 518l18 12-18 12" class="line" stroke="#171717"/>
</svg>
