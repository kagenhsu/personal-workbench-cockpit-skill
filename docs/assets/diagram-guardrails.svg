<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">個人工作台安全邊界</title><desc id="desc">AI 可以先做草稿，正式資料與外部動作需要使用者確認</desc>
  <style>.ink{fill:#171717;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}.t{font-size:30px;font-weight:800}.b{font-size:20px;font-weight:800}.s{font-size:16px;font-weight:600}.line{fill:none;stroke:#171717;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
  <rect width="1200" height="620" rx="24" fill="#f7edda"/><text x="48" y="64" class="ink t">先做可檢查的草稿</text><text x="48" y="98" class="ink b">能協助整理，不代表可以直接替你落地</text>
  <g transform="translate(70 160)"><rect width="470" height="330" rx="18" fill="#f0fdf4" stroke="#168449" stroke-width="6"/><circle cx="65" cy="65" r="30" fill="#168449"/><text x="55" y="75" fill="#fff" font-size="25" font-weight="800">可</text><text x="118" y="75" class="ink t">可以先做</text><path d="M48 132h360M48 160h290" class="line" stroke="#168449" opacity=".5"/><text x="48" y="220" class="ink b">AI 草稿</text><text x="48" y="258" class="ink s">頁面結構／任務方案／流程整理</text><text x="48" y="292" class="ink s">待分類內容／學習進度／驗收清單</text></g>
  <g transform="translate(660 160)"><rect width="470" height="330" rx="18" fill="#fff1f2" stroke="#dc2626" stroke-width="6"/><circle cx="65" cy="65" r="30" fill="#dc2626"/><text x="55" y="75" fill="#fff" font-size="25" font-weight="800">問</text><text x="118" y="75" class="ink t">需要確認</text><path d="M48 132h360M48 160h290" class="line" stroke="#dc2626" opacity=".5"/><text x="48" y="220" class="ink b">正式動作</text><text x="48" y="258" class="ink s">寫入正式資料／發布／通知</text><text x="48" y="292" class="ink s">部署／刪除／付款／敏感資料</text></g>
  <g transform="translate(440 523)"><rect width="320" height="58" rx="29" fill="#fffdf7" stroke="#171717" stroke-width="4"/><text x="58" y="38" class="ink b">看清楚 → 再確認 → 再執行</text></g>
</svg>
