    <rect x="28" y="166" width="55" height="48" fill="#facc15"/>
    <rect x="92" y="166" width="55" height="48" fill="#86efac"/>
    <rect x="156" y="166" width="45" height="48" fill="#f87171"/>
    <path d="M28 237h168M28 253h120" class="stroke" stroke-width="3"/>
    <text x="31" y="47" class="ink label">腳本</text>
