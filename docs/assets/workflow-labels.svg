    <path d="M45 82c20-55 70-55 78 0 7 50-27 57-20 91m0 0c3-16 28-20 39-3" class="stroke" stroke-width="4"/>
    <path d="M77 167c21-13 45-13 64 0M92 202h36M84 218h51" class="stroke" stroke-width="3"/>
    <text x="38" y="250" class="ink small">把想法先留下來</text>
    <rect x="0" y="258" width="226" height="24" fill="#eab308" opacity=".85"/>
    <text x="38" y="48" class="ink label">靈感</text>
  </g>

  <path d="M268 230c38-28 49-29 78-5" class="stroke" stroke="#dc2626"/>
  <path d="m331 213 18 12-22 4" class="stroke" stroke="#dc2626"/>

  <g transform="translate(360 64) rotate(2 116 150)" filter="url(#paper-shadow)">
    <path d="M6 18 230 0l6 298-226 14Z" fill="#fffdf7" stroke="#171717" stroke-width="3"/>
