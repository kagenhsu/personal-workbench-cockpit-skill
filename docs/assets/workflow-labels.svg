<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">靈感到復盤的五階段流程</title>
  <desc id="desc">以手繪紙張與箭頭說明靈感、腳本、發布、數據、復盤五個階段</desc>
  <defs>
    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#171717" flood-opacity=".13"/>
    </filter>
    <pattern id="paper-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d9cbaa" opacity=".55"/>
    </pattern>
    <style>
      .ink { fill: #171717; font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
      .label { font-size: 31px; font-weight: 800; }
      .detail { font-size: 19px; font-weight: 600; }
      .small { font-size: 15px; font-weight: 700; }
      .stroke { fill: none; stroke: #171717; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1440" height="520" fill="#f7edda"/>
  <rect width="1440" height="520" fill="url(#paper-dots)"/>
  <path d="M42 446c180-20 312 18 489-4 224-28 401 22 604-4 116-15 197 1 261-9" class="stroke" stroke="#b45309" stroke-width="3" opacity=".42"/>

