    <path d="M37 211h164M49 211V88M84 211v-61M120 211V108M156 211v-91M192 211v-83" class="stroke" stroke="#171717" stroke-width="3"/>
    <path d="M37 170h164M37 129h164M37 88h164" class="stroke" stroke="#171717" stroke-width="3"/>
