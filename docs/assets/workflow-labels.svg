    <text x="33" y="278" class="ink detail">確認時間再送出</text>
  </g>

  <path d="M928 230c35-25 52-24 79-3" class="stroke" stroke="#dc2626"/>
  <path d="m989 216 19 11-21 4" class="stroke" stroke="#dc2626"/>

