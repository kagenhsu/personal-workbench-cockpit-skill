<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">個人工作台提示詞中心</title><desc id="desc">安裝、建立、修改與驗收四種可複製提示詞</desc>
  <style>.ink{fill:#171717;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}.t{font-size:30px;font-weight:800}.b{font-size:20px;font-weight:800}.s{font-size:16px;font-weight:600}.line{fill:none;stroke:#171717;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
  <rect width="1200" height="620" rx="24" fill="#f7edda"/><text x="48" y="64" class="ink t">提示詞是捷徑，不是門檻</text><text x="48" y="98" class="ink b">每個入口都可以改成你自己的說法</text>
  <g transform="translate(70 160)"><rect width="470" height="150" rx="16" fill="#fffdf7" stroke="#2563eb" stroke-width="5"/><circle cx="48" cy="49" r="27" fill="#2563eb"/><text x="39" y="58" fill="#fff" font-size="22" font-weight="800">01</text><text x="94" y="58" class="ink t">安裝確認</text><rect x="32" y="88" width="405" height="38" rx="19" fill="#dbeafe"/><text x="53" y="113" class="ink s">確認 Skill 已可使用</text></g>
  <g transform="translate(660 160)"><rect width="470" height="150" rx="16" fill="#fffdf7" stroke="#facc15" stroke-width="5"/><circle cx="48" cy="49" r="27" fill="#facc15"/><text x="39" y="58" fill="#171717" font-size="22" font-weight="800">02</text><text x="94" y="58" class="ink t">建立工作台</text><rect x="32" y="88" width="405" height="38" rx="19" fill="#fef3c7"/><text x="53" y="113" class="ink s">先問四項藍圖再生成</text></g>
  <g transform="translate(70 365)"><rect width="470" height="150" rx="16" fill="#fffdf7" stroke="#dc2626" stroke-width="5"/><circle cx="48" cy="49" r="27" fill="#dc2626"/><text x="39" y="58" fill="#fff" font-size="22" font-weight="800">03</text><text x="94" y="58" class="ink t">持續修改</text><rect x="32" y="88" width="405" height="38" rx="19" fill="#fee2e2"/><text x="53" y="113" class="ink s">整理痛點並提出最小方案</text></g>
  <g transform="translate(660 365)"><rect width="470" height="150" rx="16" fill="#fffdf7" stroke="#168449" stroke-width="5"/><circle cx="48" cy="49" r="27" fill="#168449"/><text x="39" y="58" fill="#fff" font-size="22" font-weight="800">04</text><text x="94" y="58" class="ink t">驗收</text><rect x="32" y="88" width="405" height="38" rx="19" fill="#dcfce7"/><text x="53" y="113" class="ink s">實際操作並留下結果</text></g>
</svg>
