<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">工作台完成驗收與持續優化</title><desc id="desc">從流程驗收、使用回饋、最小修改到版本紀錄的循環</desc>
  <style>.ink{fill:#171717;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}.t{font-size:30px;font-weight:800}.b{font-size:20px;font-weight:800}.s{font-size:16px;font-weight:600}.line{fill:none;stroke:#171717;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
  <rect width="1200" height="650" rx="24" fill="#f7edda"/><text x="48" y="64" class="ink t">完成不是結束</text><text x="48" y="98" class="ink b">驗收一次，使用一輪，再用證據決定下一個小改動</text>
  <g transform="translate(442 222)"><circle cx="158" cy="104" r="105" fill="#fffdf7" stroke="#171717" stroke-width="5"/><circle cx="158" cy="104" r="48" fill="#2563eb"/><path d="m133 105 18 18 39-44" class="line" stroke="#fff" stroke-width="8"/><text x="83" y="262" class="ink b">可運作的工作台</text></g>
  <g transform="translate(55 155)"><rect width="310" height="150" rx="16" fill="#fffdf7" stroke="#168449" stroke-width="5"/><circle cx="45" cy="46" r="27" fill="#168449"/><text x="35" y="55" fill="#fff" font-size="22" font-weight="800">01</text><text x="88" y="56" class="ink t">驗收</text><text x="30" y="103" class="ink s">輸入、執行、結果能跑通</text><text x="30" y="130" class="ink s">手機與安全邊界也通過</text></g>
  <g transform="translate(835 155)"><rect width="310" height="150" rx="16" fill="#fffdf7" stroke="#facc15" stroke-width="5"/><circle cx="45" cy="46" r="27" fill="#facc15"/><text x="35" y="55" fill="#171717" font-size="22" font-weight="800">02</text><text x="88" y="56" class="ink t">使用回饋</text><text x="30" y="103" class="ink s">記錄哪裡卡住或容易遺漏</text><text x="30" y="130" class="ink s">保留實際數據與建議</text></g>
  <g transform="translate(55 405)"><rect width="310" height="150" rx="16" fill="#fffdf7" stroke="#dc2626" stroke-width="5"/><circle cx="45" cy="46" r="27" fill="#dc2626"/><text x="35" y="55" fill="#fff" font-size="22" font-weight="800">03</text><text x="88" y="56" class="ink t">最小修改</text><text x="30" y="103" class="ink s">只改一個痛點與必要範圍</text><text x="30" y="130" class="ink s">修改後重新實際操作</text></g>
  <g transform="translate(835 405)"><rect width="310" height="150" rx="16" fill="#fffdf7" stroke="#2563eb" stroke-width="5"/><circle cx="45" cy="46" r="27" fill="#2563eb"/><text x="35" y="55" fill="#fff" font-size="22" font-weight="800">04</text><text x="88" y="56" class="ink t">版本紀錄</text><text x="30" y="103" class="ink s">留下變更、結果與未完成項目</text><text x="30" y="130" class="ink s">形成下一輪優化依據</text></g>
  <path d="M365 230h64M771 230h64M365 480h64M771 480h64" class="line"/><path d="m413 218 18 12-18 12M819 218l18 12-18 12M413 468l18 12-18 12M819 468l18 12-18 12" class="line"/>
  <path d="M1030 305c70 45 66 102-2 111M170 305c-70 45-66 102 2 111" class="line" stroke="#b66b00" stroke-dasharray="10 12"/><text x="454" y="614" class="ink b">驗收 → 使用 → 回饋 → 小改 → 再驗收</text>
</svg>
