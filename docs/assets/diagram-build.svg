<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">PM Skill 到開發落地流程</title><desc id="desc">從產品規範、設計源文件、MCP、Agent 到開發驗收</desc>
  <style>.ink{fill:#171717;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}.t{font-size:29px;font-weight:800}.b{font-size:20px;font-weight:800}.s{font-size:16px;font-weight:600}.line{fill:none;stroke:#171717;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
  <rect width="1200" height="620" rx="24" fill="#f7edda"/><text x="48" y="64" class="ink t">想法如何真正落地</text><text x="48" y="98" class="ink b">每一站都要留下下一站能使用的資料</text>
  <g transform="translate(45 175)"><rect width="205" height="190" rx="16" fill="#fffdf7" stroke="#2563eb" stroke-width="5"/><circle cx="42" cy="44" r="25" fill="#2563eb"/><text x="34" y="53" fill="#fff" font-size="21" font-weight="800">01</text><text x="28" y="94" class="ink t">PM Skill</text><text x="28" y="135" class="ink s">問題／場景／驗收</text></g>
  <g transform="translate(275 175)"><rect width="205" height="190" rx="16" fill="#fffdf7" stroke="#facc15" stroke-width="5"/><circle cx="42" cy="44" r="25" fill="#facc15"/><text x="34" y="53" fill="#171717" font-size="21" font-weight="800">02</text><text x="28" y="94" class="ink t">設計稿</text><text x="28" y="135" class="ink s">層級／狀態／變量</text></g>
  <g transform="translate(505 175)"><rect width="205" height="190" rx="16" fill="#fffdf7" stroke="#dc2626" stroke-width="5"/><circle cx="42" cy="44" r="25" fill="#dc2626"/><text x="34" y="53" fill="#fff" font-size="21" font-weight="800">03</text><text x="28" y="94" class="ink t">MCP</text><text x="28" y="135" class="ink s">資料／工具／權限</text></g>
  <g transform="translate(735 175)"><rect width="205" height="190" rx="16" fill="#fffdf7" stroke="#168449" stroke-width="5"/><circle cx="42" cy="44" r="25" fill="#168449"/><text x="34" y="53" fill="#fff" font-size="21" font-weight="800">04</text><text x="28" y="94" class="ink t">Agent</text><text x="28" y="135" class="ink s">角色／輸入／交接</text></g>
  <g transform="translate(965 175)"><rect width="190" height="190" rx="16" fill="#fffdf7" stroke="#171717" stroke-width="5"/><circle cx="42" cy="44" r="25" fill="#171717"/><text x="34" y="53" fill="#fff" font-size="21" font-weight="800">05</text><text x="28" y="94" class="ink t">落地</text><text x="28" y="135" class="ink s">開發／測試／驗收</text></g>
  <path d="M250 270h22M480 270h22M710 270h22M940 270h22" class="line"/><path d="m263 258 18 12-18 12M493 258l18 12-18 12M723 258l18 12-18 12M953 258l18 12-18 12" class="line"/>
  <g transform="translate(166 465)"><rect width="870" height="76" rx="38" fill="#fffdf7" stroke="#171717" stroke-width="4"/><text x="45" y="48" class="ink b">規格</text><text x="200" y="48" class="ink b">→</text><text x="280" y="48" class="ink b">可編輯設計</text><text x="510" y="48" class="ink b">→</text><text x="590" y="48" class="ink b">受控交接</text><text x="770" y="48" class="ink b">→</text><text x="845" y="48" class="ink b">驗收</text></g>
